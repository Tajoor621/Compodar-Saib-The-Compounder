name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip pages]')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the static site
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish the site into the branch Pages already serves
        run: |
          if [ -z "$(git status --porcelain -- index.html 404.html .nojekyll manifest.webmanifest favicon.svg assets __grok/icon-180.png intake pharmacy desk drug-info assistant reference privacy case desks community-care pages-sw.js pakistan-pharmacy)" ]; then
            echo "Published files already match this build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll manifest.webmanifest favicon.svg assets __grok/icon-180.png intake pharmacy desk drug-info assistant reference privacy case desks community-care pages-sw.js pakistan-pharmacy
          git commit -m "chore: publish the public site [skip pages]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
