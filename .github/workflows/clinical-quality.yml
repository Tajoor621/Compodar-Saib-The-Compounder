name: Clinical quality and security gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Lint
        if: always()
        run: npm run lint
      - name: Focused clinical and safety tests
        if: always()
        run: npm run test:clinical
      - name: Full repository test suite
        if: always()
        run: npm test
      - name: Clinical evaluation release gate
        if: always()
        run: node scripts/eval/run.mjs
      - name: Dependency security audit
        if: always()
        run: npm audit --audit-level=high
      - name: Production-mode compile
        if: always()
        run: npm run build
      - name: GitHub Pages static build
        if: always()
        run: npm run build:pages
      - name: Install Chromium for the Pages browser check
        if: always()
        run: npx playwright install --with-deps chromium
      - name: Verify community care in browser
        if: always()
        run: node scripts/community-care-browser.mjs
